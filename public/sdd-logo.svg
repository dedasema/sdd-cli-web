<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39D353" />
      <stop offset="100%" stop-color="#56D4DD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="#161B22" stroke="#30363D" stroke-width="4" />
  
  <!-- Terminal Prompt Symbol > -->
  <path d="M46 64 L92 100 L46 136" stroke="url(#grad-accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Gate Checkpoint / Diamond & Horizontal Bar -->
  <line x1="112" y1="136" x2="154" y2="136" stroke="#39D353" stroke-width="12" stroke-linecap="round" />
  
  <!-- Checkpoint Gate Node (Hexagon/Diamond Checkmark) -->
  <circle cx="135" cy="86" r="22" fill="#0D1117" stroke="#39D353" stroke-width="5" />
  <path d="M125 86 L132 93 L146 78" stroke="#39D353" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
